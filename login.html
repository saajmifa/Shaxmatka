<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kirish — Shaxmatka</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-sm bg-white border border-gray-200 rounded-xl shadow-sm p-6">
    <h1 class="text-lg font-semibold text-gray-900 mb-1">Shaxmatka</h1>
    <p class="text-sm text-gray-500 mb-5">Kirish uchun login va parolingizni kiriting.</p>
    <form id="loginForm" class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Login</label>
        <input id="username" name="username" autocomplete="username"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Parol</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      </div>
      <div id="err" class="text-sm text-red-600 hidden"></div>
      <button type="submit" id="submitBtn"
        class="w-full bg-blue-600 text-white text-sm font-medium rounded-md py-2 hover:bg-blue-700 disabled:opacity-60">
        Kirish
      </button>
    </form>
    <p class="text-xs text-gray-400 mt-4">Hisobingiz yo'qmi? Founder yoki administrator bilan bog'laning.</p>
  </div>
  <script>
    const form = document.getElementById("loginForm");
    const err = document.getElementById("err");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.classList.add("hidden");
      submitBtn.disabled = true;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/.netlify/functions/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = "/index.html";
        } else {
          err.textContent = data.message || "Xatolik yuz berdi.";
          err.classList.remove("hidden");
        }
      } catch {
        err.textContent = "Server bilan bog'lanib bo'lmadi.";
        err.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
